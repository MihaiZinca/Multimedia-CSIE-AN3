<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Agenda</title>
    <style type="text/css">
        /*exemplu cascadare*/
        body {
            font-family: Tahoma, sans-serif;
            font-size: 11pt;
        }

        body {
            margin: 0;
            padding: 16px;
        }

        h1{
            color: white;
            background-color: navy;
            padding: 16px;
            margin: -16px;
            margin-bottom: 20px;
        }

        caption{
            padding: 8px 0;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            color: navy;

        }
        
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid gainsboro;
            text-align: left;
        }

        th{
            border-bottom: 2px solid navy;
            color: navy;
        }

        tfoot td {
            font-style: italic;
            color: gray;
            border-bottom: none;
        }

        table{
            border-collapse: collapse;
        }

        form{
            padding: 16px;
            background-color: lavender;
            border-top: 4px solid navy;
        }

        input
        {
            padding: 4px 6px;
            border: 1px solid darkgray;
        }

        #btnAdauga {
            background-color: navy;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 6px;
            padding: 8px;
        }
        table{
            float: left;
            width: 60%;          
        }

        form {
            float: right;
            width: 30%;
        }

        lable {
            display: block;
            float: left;
            width: 30%;
            clear: both;
            margin-bottom: 10px;
            padding: 4px 0;
        }

        input {
            display: block;
            float: right;
            width: 60%;
            margin-bottom: 10px;
        }

        
    </style>
</head>
<body>
    <h1>Agenda telefonică</h1>
    <table>
         <caption>Lista persoane</caption>
        <thead>
            <tr>
                <th class="ion">Nume</th>
                <th class="maria ion">Prenume</th>
                <th>Telefon</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Popescu</td>
                <td>Maria</td>
                <td>0938374141</td>
            </tr>
            <tr>
                <td>Vasilescu</td>
                <td>Ion</td>
                <td>072345689</td>
            </tr>
            <tr>
                <td>Pop</td>
                <td>Vasile</td>
                <td>073245455</td>

            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Numar persoane: 3</td>
            </tr>
        </tfoot>
    </table>
    <form>
        <label for="nume">Nume:</label>
        <input id="nume">

        <label for="prenume">Prenume:</label>
        <input id="prenume">

        <label for="telefon">Telefon:</label>
        <input id="telefon">

        <input type="button" id="btnAdauga" value="Adauga">

    </form>
</body>
</html>
