<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agenda telefonică</title>
    <style type="text/css">
        /* Seminar 3 — agenda telefonică: foaia de stil */

        /* region: pas1 */
        /* Pasul 1 — fontul: body îl transmite prin moștenire; input nu moștenește, deci se grupează cu body */
        body, input {
            font-family: Tahoma, Verdana, sans-serif;
            font-size: 11pt;
        }
        /* endregion */

        /* region: pas2 */
        /* Pasul 2 — titlul: bandă pe toată lățimea ferestrei, trasă peste padding-ul lui body */
        body {
            margin: 0;
            padding: 16px;
        }

        h1 {
            margin: -16px -16px 20px -16px;
            padding: 16px;
            background-color: navy;
            color: white;
        }
        /* endregion */

        /* region: pas3 */
        /* Pasul 3 — tabelul: doar linii orizontale */
        table {
            border-collapse: collapse;
        }

        caption {
            padding: 8px 0;
            font-size: 13pt;
            font-weight: bold;
            color: navy;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid gainsboro;
            text-align: left;
        }

        th {
            border-bottom: 2px solid navy;
            color: navy;
        }

        tfoot td {
            border-bottom: none;
            color: gray;
            font-style: italic;
        }
        /* endregion */

        /* region: pas4 */
        /* Pasul 4 — formularul: selector de clasă și selector de atribut */
        .controls {
            padding: 16px;
            background-color: lavender;
            border-top: 4px solid navy;
        }

        input {
            padding: 4px 6px;
            border: 1px solid darkgray;
        }

            input[type="button"] {
                margin-top: 6px;
                padding: 8px;
                border: none;
                background-color: navy;
                color: white;
                font-weight: bold;
            }
        /* endregion */

        /* region: pas5 */
        /* Pasul 5 — layout: tabelul la stânga, formularul la dreapta */
        table {
            float: left;
            width: 60%;
        }

        .controls {
            float: right;
            width: 30%;
        }
        /* endregion */

        /* region: pas6 */
        /* Pasul 6 — etichete și câmpuri pe rânduri: display, float și clear */
        label {
            display: block;
            float: left;
            clear: both;
            width: 30%;
            padding: 4px 0;
            margin-bottom: 10px;
        }

        input {
            display: block;
            float: right;
            width: 60%;
            margin-bottom: 10px;
        }

            input[type="button"] {
                clear: both;
                width: 100%;
            }
        /* endregion */

        .selectat{
            background-color:lavender;
        }

        tbody{
            cursor:pointer;
        }

    </style>


    <script type="text/javascript">

        // 1. 
        const SERVER_URL = 'https://ase.softmentor.ro/agenda';
        let persoane = [];
        let filtru = '';
        let persoanaSelectata = null;

        function getPersoaneFiltrare() {
            return persoane.filter(p => !filtru
                || p.nume.toLowerCase().includes(filtru.toLowerCase())
                || p.prenume.toLowerCase().includes(filtru.toLowerCase())
                || p.telefon.toLowerCase().includes(filtru.toLowerCase())
            );
        }

        function esteAceeasi(p1, p2) {
            return p1 != null && p2 != null &&
                p1.nume === p2.nume
                && p1.prenume === p2.prenume
                && p1.telefon === p2.telefon;
        }

        // 2. Afisare
        function afisare() {
            const tbody = document.querySelector("tbody");
            tbody.innerHTML = "";

            for (const persoana of getPersoaneFiltrare()) {
                const rand = document.createElement("tr");
                tbody.append(rand);

                if (esteAceeasi(persoana, persoanaSelectata)) {
                    rand.classList.add('selectat');
                }

                const adaugaCelula = (text) => {
                    const celula = document.createElement('td');
                    celula.innerText = text;
                    celula.addEventListener('click', () => {
                        persoanaSelectata = persoana;
                        afisare();
                    });
                    rand.append(celula);
                }
                adaugaCelula(persoana.nume);
                adaugaCelula(persoana.prenume);
                adaugaCelula(persoana.telefon);
            }

            const footer = document.querySelector('tfoot td');
            footer.innerText = `Numar persoane: ${persoane.length}`;
        }

        // 3. Event Handlers
        async function adauga() {
            const persoana = {
                nume: document.querySelector('#nume').value,
                prenume: document.querySelector('#prenume').value,
                telefon: document.querySelector('#telefon').value
            };
            const raspuns = await fetch(SERVER_URL, {
                method: 'POST',
                body: JSON.stringify(persoana)
            });
            if (raspuns.ok) {
                await actualizeaza();
            }
            else {
                console.error(`Eroare:  ${raspuns.status}- ${raspuns.statusText}` + `(${raspuns.headers.get('x-eroare')})`);
            }
        }

        async function actualizeaza() {
            const raspuns = await fetch(SERVER_URL);
            if (raspuns.ok) {
                persoane = await raspuns.json();
                afisare();
            }
            else {
                console.error(`Eroare:  ${raspuns.status}- ${raspuns.statusText}` + `(${raspuns.headers.get('x-eroare')})`);
            }
        }

        function filtreaza() {
            filtru = document.querySelector('#filtru').value;
            afisare();
        }

        // 4. Initializare
        async function aplicatie() {
            const buton = document.querySelector("#btnAdauga");
            buton.addEventListener("click", adauga);
            document.querySelector('#filtru')
                .addEventListener('input', filtreaza);
            afisare();

            await actualizeaza();
            setInterval(actualizeaza, 2000);
        }
        document.addEventListener("DOMContentLoaded", aplicatie);
    </script>

</head>
<body>
    <h1>Agenda telefonică</h1>
    <table>
        <caption>
            Lista persoane
            <input id="filtru">
        </caption>
        <thead>
            <tr>
                <th class="ion">Nume</th>
                <th>Prenume</th>
                <th class="ion maria">Telefon</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Popescu</td>
                <td>Ion</td>
                <td>023423222</td>
            </tr>
            <tr>
                <td>Vasilescu</td>
                <td>Maria</td>
                <td>073423222</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Număr persoane: 2</td>
            </tr>
        </tfoot>
    </table>
    <form action="#" class="controls">
        <label id="mirel" for="nume">Nume:</label>
        <input name="nume" id="nume">

        <label for="prenume">Prenume:</label>
        <input name="prenume" id="prenume">

        <label for="Telefon">Telefon:</label>
        <input name="telefon" id="telefon">

        <input type="button" id="btnAdauga" name="btnAdauga" value="Adaugă">
    </form>
</body>
</html>
